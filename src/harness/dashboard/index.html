<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Frontier Harness</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><a class="skip" href="#workspace">Skip to work</a>
<header class="topbar"><a class="brand" href="/" aria-label="Frontier Harness home"><svg viewBox="0 0 28 28" width="28" height="28" aria-hidden="true"><path d="M5 7h8l10 14M5 21h8L23 7M5 7v14M23 7v14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>frontier</span></a><nav aria-label="Main"><button data-view="work" aria-current="page">Workspace</button><button data-view="learning">Learning</button><button data-view="activity">Activity</button><button data-view="notifications">Notifications</button></nav><span id="connection" role="status">Connecting</span></header>
<main><div class="toolbar"><label class="goal-select">Goal <select id="goal-select" aria-label="Current goal"><option>No goals yet</option></select></label><div class="actions"><button id="refresh">Refresh</button><button class="primary" id="new-goal">New goal</button></div></div>
<div id="notice" role="status" aria-live="polite"></div>
<section id="prepare" class="panel" hidden><h2>Give your workforce an outcome.</h2><p class="muted">Prepare the scope and limits, then approve the exact plan.</p><form id="goal-form"><label>Outcome<textarea name="objective" required rows="2" placeholder="What should be finished?"></textarea></label><label>Acceptance criteria<textarea name="acceptance" required rows="2" placeholder="One verifiable condition per line"></textarea></label><div class="form-row"><label>Mode<select name="mode" id="mode-select"><option value="collaborative">Collaborative</option><option value="deepseek_only">DeepSeek only</option><option value="codex_only">Codex only</option><option value="overnight_review">Overnight review</option></select></label><label>Hours<input name="hours" type="number" min="1" max="24" value="8" required></label><label>Assignments<input name="maxTasks" type="number" min="1" max="100" value="10" required></label></div><details><summary>Project and public-source scope</summary><label>Approved project JSON<textarea name="project" rows="4" placeholder="Optional: repository, baseCommit, readPaths, writePaths and trusted checks"></textarea></label><label>Allowed source domains<input name="domains" placeholder="Optional, separated by commas"></label><label>Approved starting URLs<textarea name="urls" rows="2" placeholder="One public HTTPS URL per line"></textarea></label></details><div class="actions"><button class="primary" type="submit">Prepare goal</button><button type="button" id="cancel-goal">Cancel</button></div></form><div id="approval"></div></section>
<div id="workspace" tabindex="-1"><p class="empty">Loading saved work…</p></div></main><footer>Local coordination. Explicit scope. Evidence you can inspect.</footer></body></html>
