<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101416">
  <meta name="description" content="Mosaic — a read-only window into coordinated coding work. Mac app for your registered coding work.">
  <title>Mosaic — Work, together</title>
  <link rel="icon" href="assets/mosaic.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/BricolageGrotesque-Variable.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/fonts/InstrumentSans-Variable.ttf" as="font" type="font/ttf" crossorigin>
  <style>/* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio, geometry.
   Put this @layer first; product CSS outside the layer wins ordinary layout rules.
   Native hidden and closed-dialog states take precedence over component display rules. */
@layer od-layout {
  [hidden]:not([hidden="until-found" i]) { display: none !important; }
  dialog:not([open]) { display: none !important; }

  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

  /* containers */
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

  /* stacked information: each piece is its own line — never sibling inline spans */
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }

  /* media keeps its intrinsic ratio by default; never a distorted or cropped
     cover by accident. height:auto lets the ratio win over an <img height="…">
     attribute. Cropping to a uniform box is an explicit opt-in: set --od-ratio
     AND add .od-media-cover together (per the core rule, only where a crop is
     deliberate — tile thumbs, decorative fills — never on full-frame content). */
  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }

  /* functional inline SVG icons opt into bounded geometry; content SVGs keep their own */
  .od-icon { display: inline-block; inline-size: var(--od-icon-size, 1em); block-size: var(--od-icon-size, 1em); flex: none; }

  /* data text only — authored copy is rewritten to its budget instead */
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }   /* block-level reservation for a shared baseline */
  .od-nowrap  { white-space: nowrap; }           /* 数字+单位 · 价格+起 · 日期+星期 */
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; } /* CJK labels break at spaces / <wbr> first */

  /* screen skeleton (optional): bars take their own space, the middle scrolls — no padding guessed for chrome */
  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

  /* horizontal rail: the next item peeks at the edge; trailing room survives overflow */
  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
:root [hidden]:where(:not([hidden="until-found" i])) { display: none; }
/* /OD-LAYOUT-PRIMITIVES v1 */
</style>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="motion.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" aria-label="Workspace navigation">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 28 28" fill="none" aria-hidden="true"><path d="M2 3a1 1 0 0 1 1-1h9v10H2V3Z" fill="var(--mint)"/><path d="M16 2h9a1 1 0 0 1 1 1v9H16V2Z" fill="var(--secondary)"/><path d="M2 16h10v10H3a1 1 0 0 1-1-1v-9Z" fill="var(--secondary)"/><path d="M16 16h10v9a1 1 0 0 1-1 1h-9V16Z" fill="var(--mint)"/></svg>
        <span>Mosaic</span>
      </div>
      <div class="project-picker">
        <label for="project-select">Project</label>
        <div class="select-wrap"><span class="project-mini" id="project-initials">PL</span><select id="project-select" aria-label="Select project"><option value="pocket">Pocket Ledger</option></select></div>
      </div>
      <nav class="nav" aria-label="Main navigation">
        <button type="button" class="nav-button" data-action="view" data-view="recent"><svg class="od-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Recent</span></button>
        <button type="button" class="nav-button active" data-action="view" data-view="overview" aria-current="page"><svg class="od-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><rect x="4" y="4" width="6" height="16" rx="2"/><rect x="14" y="4" width="6" height="16" rx="2"/></svg><span>Current work</span></button>
        <button type="button" class="nav-button" data-action="view" data-view="timeline"><svg class="od-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M5 4v16M10 6h10M10 12h7M10 18h10"/><circle cx="5" cy="6" r="1.5"/><circle cx="5" cy="12" r="1.5"/><circle cx="5" cy="18" r="1.5"/></svg><span>Shared timeline</span></button>
        <button type="button" class="nav-button" data-action="view" data-view="history"><svg class="od-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M3 11a9 9 0 1 1 2.6 7M3 4v7h7M12 7v5l3 2"/></svg><span>History</span></button>
        <button type="button" class="nav-button" data-action="view" data-view="projects"><svg class="od-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Projects</span></button>
      </nav>
      <section class="sidebar-section" aria-label="Project assignments"><p class="sidebar-label" id="sidebar-task-label">Assignments</p><div class="sidebar-assignments" id="side-tasks"></div></section>
      <div class="sidebar-bottom">
        <button type="button" class="workspace-button" data-action="about" aria-label="About Mosaic"><span class="avatar">M</span><span class="od-field"><span class="small">Personal workspace</span><span class="tiny muted">Live observer</span></span><svg class="od-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10h.01"/></svg></button>
        <p class="sidebar-note">A window into the work.<br>Instructions stay in Codex.</p>
      </div>
    </aside>
    <section class="workspace" aria-label="Mosaic work observer">
      <header class="topbar">
        <div class="breadcrumb"><span id="breadcrumb-project" class="od-truncate">Pocket Ledger</span><svg class="od-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg><span id="breadcrumb-view" class="od-nowrap">Current work</span></div>
        <div class="topbar-end"><div id="connection" class="connection"><span class="status-dot"></span><span class="connection-label">Coordinator connected</span></div><button type="button" class="sample-badge" data-action="about" aria-label="About this observer">Live observer</button></div>
      </header>
      <div class="snapshot-notice" id="snapshot-notice" role="status" hidden><p id="snapshot-message"></p><button type="button" class="text-button" data-action="refresh">Retry connection</button></div>
      <div class="layout" id="layout">
        <main class="main-scroll" id="main" tabindex="-1" aria-label="Work overview"></main>
        <aside class="inspector" id="inspector" aria-label="Selected task details"></aside>
      </div>
    </section>
  </div>
  <dialog class="dialog" id="info-dialog" aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title"></h2><button type="button" class="icon-button" id="dialog-close" data-action="close-dialog" aria-label="Close information"><svg class="od-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div><div id="dialog-body"></div><button type="button" class="soft-button" data-action="close-dialog">Got it</button></dialog>
  <noscript><div style="padding:24px;background:#202324;color:#f0f2ee">Mosaic needs JavaScript to display saved work.</div></noscript>
  <script src="mock-data.js"></script>
  <script src="adapter.js"></script>
  <script src="runtime.js"></script>
  <script src="app.js"></script>
</body>
</html>
