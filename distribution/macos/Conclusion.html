<h1>Finish installing Mosaic</h1>
<p>In Finder, choose Go → Home. Open <strong>Mosaic Setup</strong>, open
<strong>@VERSION@</strong>, then double-click <strong>Finish Installing Mosaic</strong>.</p>
<p>Terminal will verify and install Mosaic for your account. On a first install,
you can choose to open Mosaic setup when it finishes.</p>
